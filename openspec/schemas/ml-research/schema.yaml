name: ml-research
version: 2
description: >
  Iterative machine-learning experiment workflow that connects
  previous findings, hypotheses, implementation variants,
  evaluation and experimental results.

artifacts:

  - id: proposal
    generates: proposal.md
    description: >
      Research motivation, previous findings, hypothesis and
      the ML variant that should be investigated.
    template: proposal.md
    instruction: |
      Describe WHY this change is being performed.

      FIRST determine the change type and record it in the proposal
      (`Type:`): `experiment` (model/method variant evaluated against a
      baseline), `dataset` (creation/resampling/analysis of a dataset) or
      `change` (tooling, code, spec maintenance).

      ALWAYS ASK the user whether there is a hypothesis (AskUserQuestion)
      before writing the proposal — never invent one. A hypothesis is
      optional: if the user has none (typical for dataset, exploratory or
      tooling changes), write "No hypothesis (<reason>)" in the Hypothesis
      section and a Research Question / Goal instead. Do not present a
      guessed hypothesis as the user's.

      Give the change a descriptive name (`Name:`, e.g. "BERT fine-tuned")
      plus an acronym (e.g. "BERT-FT"); use both consistently everywhere.

      If needed connect the experiment to findings from previous
      experiments or archived OpenSpec changes whenever they exist.

      Clearly distinguish:
      - previous evidence
      - hypothesis (only if one exists)
      - proposed change
      - expected outcome

      Do not present hypotheses as established facts.
    requires: []

  - id: design
    generates: design.md
    description: >
      Technical and experimental design of the ML variant.
    template: design.md
    instruction: |
      If a baseline exists, describe exactly how the proposed ML variant differs from
      the current baseline other wise explain the approach

      Specify:
      - baseline
      - implementation variant
      - changed variables
      - controlled variables
      - model
      - datasets
      - data splits
      - training setup
      - seeds
      - relevant hyperparameters
      - reproducibility requirements

      Prefer experiments that isolate one research question.
    requires:
      - proposal

  - id: evaluation
    generates: evaluation.md
    description: >
      Evaluation plan, metrics and success criteria for the experiment.
    template: evaluation.md
    instruction: |
      Define how the experiment will be evaluated before running it.

      Include:
      - primary metric
      - secondary metrics (always micro AND macro precision/recall/F1, so the
        run can be added to the spec's standard table)
      - evaluation setting (split, label source, scoring variant, threshold
        selection) — fixed so all variants are comparable to earlier rows
      - baseline comparison
      - important slices or subgroups
      - required ablations
      - success criteria
      - conditions that would falsify the hypothesis (only if the proposal
        has a hypothesis; otherwise state what question the numbers answer)

      For `dataset` changes: the evaluation is the dataset statistics and
      quality checks (size, coverage, distributions, leakage) instead of
      model metrics.

      The evaluation should make it possible to distinguish
      improvement from noise or unrelated implementation changes.
    requires:
      - proposal
      - design

  - id: tasks
    generates: tasks.md
    description: >
      Implementation, training, evaluation and documentation checklist.
    template: tasks.md
    instruction: |
      Turn the experiment design into concrete executable tasks. List the Python script calls
      that are used to run the experiments and the different runs with all parameters included.

      The tasks must cover:
      1. implementation
      2. tests
      3. experiment execution
      4. evaluation
      5. creation of results.md
      6. distilling the durable finding into the knowledge base
         (specs/<capability-path>/spec.md) — unless the experiment
         establishes nothing durable and the change opts out via
         skip_specs: true

      The final tasks must document:
      - measured results
      - observations
      - interpretation
      - whether the hypothesis was supported
      - the decision resulting from the experiment
      - possible next experiments
    requires:
      - design
      - evaluation

  - id: specs
    generates: "specs/**/*.md"
    description: >
      Durable, validated knowledge distilled from the experiment —
      the findings and design decisions that survived the evidence,
      not the hypothesis.
    template: spec.md
    instruction: |
      Capture what the experiment established as durable knowledge about
      the system under study, as a delta against the living knowledge base
      in openspec/specs/<capability-path>/spec.md.

      TIMING: Unlike a normal spec, this is written POST-RESULTS, during the
      results step — never up front. Record the DECISION / finding, never the
      hypothesis. A finding you could not yet confirm does not belong here.

      A refuted hypothesis is still a finding worth recording (e.g. "approach X
      degrades OOD generalization — do not use it"). Only set skip_specs: true
      when the experiment established nothing durable at all (pure tooling,
      aborted run, no interpretable evidence).

      The spec is a SUMMARY of all experiments and datasets of the
      capability. Its sections (placed BEFORE `## Requirements`, edited in
      openspec/specs/ directly, NOT via deltas):

      - `## Purpose` (new capabilities only, 50+ chars)
      - `## Code State` — what the code does now; keep current, edit in place.
      - `## Datasets` — ONLY in one dedicated dataset spec (e.g.
        `<project>-dataset`, single source). Other specs link to it instead
        of repeating it.
        EVERY dataset/split the experiments rely on: name, size, role,
        in/out-of-distribution, **how it was generated** (script/sampling
        procedure, link to archived change), **statistics** (counts,
        distributions, coverage) and **what it implies** (what it can and
        cannot tell). Dataset changes always update this section.
      - `## Experiments` — registry, one row per experiment/variant:
        `Acronym | Descriptive Name | Type | Hypothesis (or "none") |
        Result (1 sentence) | Change (link)`. Every experiment and model has
        BOTH an acronym and a descriptive name; use the descriptive name in
        prose and tables (e.g. "BERT fine-tuned (BERT-FT)").
        Changes without hypothesis (dataset/tooling) are listed too.
      - `## Evaluation Metrics Overview` — see below.

      `## Requirements` IS the findings list — no separate findings section.
      Each finding is short; details (numbers, ablations, discussion) stay
      in the archived change's results.md, which the finding links to.

      Delta operations (## headers, exactly as written):
      - **ADDED Requirements**: a newly established finding
      - **MODIFIED Requirements**: an existing finding whose conclusion changed
        (copy the ENTIRE existing block, then edit; header text must match)
      - **REMOVED Requirements**: a finding a later experiment superseded
        (include **Reason** and **Migration**)
      - **RENAMED Requirements**: FROM:/TO: header rename only

      Each finding (keep it under ~500 characters in total):
      - `### Requirement: Finding: <the finding as a short statement>` — the
        header itself is the finding and the stable identity that
        MODIFIED/REMOVED/RENAMED match on. The `Requirement:` prefix is
        required by `openspec validate`.
      - ONE sentence with the resulting decision, containing MUST/SHALL
        (required by the parser).
      - One `#### Evidence: <descriptive name>` block per supporting change:
        - **WHEN** <what was tried, on which data/split, one line>
        - **THEN** <key number(s) that established it, one line> —
          [<change>](../../changes/archive/<date>-<change>/results.md)
      - Also add/update the change's row in `## Experiments`.

      Skip the finding only for changes that establish nothing durable
      (skip_specs: true). Dataset changes still update `## Datasets`.

      `## Evaluation Metrics Overview` has two parts:
      1. **Standard table (mandatory)** — one row per evaluated variant
         (baselines and controls included) with the fixed columns
         `Experiment | Variant | Setting | Scoring | Micro P | Micro R |
         Micro F1 | Macro P | Macro R | Macro F1 | Evidence`. `Variant`
         is written `<acronym> – <descriptive name>`. All variants are
         scored on the same split (test) so rows are comparable. Micro =
         aggregated over all labels/classes; Macro = mean of per-class
         values over classes with >=1 ground-truth occurrence (undefined = 0).
         Include ALL runs of ALL experiments (also failed/negative ones).
         Multi-seed runs: mean over seeds. Never omit a column; if a metric
         could not be computed, say why in the row instead of leaving it out.
      2. **Additional metrics** — free-form `Run | Metric | Value | Evidence`
         rows for experiment-specific numbers (deltas, CIs, ablations, cost).
    requires:
      - evaluation

apply:
  requires:
    - tasks

  tracks: tasks.md

  instruction: |
    Execute the ML experiment according to the proposal,
    design and evaluation plan.

    Work through tasks.md and mark tasks complete.

    Preserve reproducibility information such as:
    - git commit
    - configuration
    - random seeds
    - dataset/version
    - model/checkpoint
    - experiment tracking run IDs when available

    After the experiment has run, create results.md. For dataset changes,
    results.md reports the dataset statistics instead of model metrics.

    In results.md clearly separate:
    1. Results (starting with a table of micro/macro precision, recall and F1
       per variant, same columns as the spec's standard table)
    2. Observations
    3. Interpretation
    4. Conclusion
    5. Decision
    6. Follow-up questions

    Then distil the durable finding into the knowledge delta at
    specs/<capability-path>/spec.md (the specs artifact), linking this
    change as evidence — unless the change opted out via skip_specs: true.
    The delta is synced into openspec/specs/ at archive time.

    Never change the original hypothesis after seeing the results
    (if the change has no hypothesis, say so in the Conclusion).